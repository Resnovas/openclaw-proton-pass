# Dependabot opened a pull request bumping vitest from 3 to 4 on its own,
# which merged green on the pull request and then broke main.
#
# It moved `vitest` without moving `@vitest/coverage-v8`, and the two
# have to be the same major: the coverage provider reaches into vitest
# internals and crashed in `convertCoverage` reading a property of undefined.
# The `vitest` group keeps them in one pull request so they can never diverge.
#
# @effect/vitest 0.30.1 supports Vitest 3 and 4 on Effect 3. Keep unsupported
# Vitest 5+ proposals deferred until the adapter's peer range includes them.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      # One pull request, so a bump can never land half applied.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
          - "@effect/vitest"
      effect:
        patterns:
          - effect
          - "@effect/*"
        exclude-patterns:
          - "@effect/vitest"
      nx:
        patterns:
          - nx
          - "@nx/*"
    ignore:
      # The current Effect 3 adapter supports Vitest 4, but not Vitest 5.
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@vitest/*"
        versions: [">=5"]
      # Effect 4 is a deliberate deferral, not an oversight: the whole
      # @effect/* line would have to move at once.
      - dependency-name: effect
        update-types: [version-update:semver-major]
      - dependency-name: "@effect/*"
        update-types: [version-update:semver-major]

  # Actions are pinned to commit SHAs, which Dependabot understands and
  # updates in place, keeping the `# vN` comment accurate.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build(actions)
